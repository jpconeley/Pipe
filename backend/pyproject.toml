[project]
name = "pvf"
version = "0.1.0"
description = "Surplus PVF marketplace API, matching engine and price index"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "pydantic>=2.14.1",
    "sqlalchemy>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
pvf = "pvf.cli:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"migrations/versions/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
