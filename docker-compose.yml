# Local development stack. `docker compose up -d --build` runs the database,
# API (http://localhost:8000) and web app (http://localhost:3000) with demo data.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pvf
      POSTGRES_PASSWORD: pvf
      POSTGRES_DB: pvf
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvf"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PVF_DATABASE_URL: postgresql+psycopg://pvf:pvf@db:5432/pvf
      PVF_WEB_URL: http://localhost:3000
      PVF_SEED_DEMO: "1"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      PVF_API_URL: http://api:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
