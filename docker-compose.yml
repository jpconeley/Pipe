# Local development stack. `docker compose up -d --build` runs the database,
# API (http://localhost:8010) and web app (http://localhost:3010) with demo data.
#
# Ports are offset from the usual 3000/8000/5432 (3010/8010/5433) so this can
# run alongside another Docker Compose project (e.g. Chorizo/LASO) that uses
# the defaults, without a port conflict.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pvf
      POSTGRES_PASSWORD: pvf
      POSTGRES_DB: pvf
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pvf"]
      interval: 5s
      retries: 10

  api:
    build: ./backend
    environment:
      PVF_DATABASE_URL: postgresql+psycopg://pvf:pvf@db:5432/pvf
      PVF_WEB_URL: http://localhost:3010
      PVF_SEED_DEMO: "1"
    ports:
      - "8010:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./web
    environment:
      PVF_API_URL: http://api:8000
    ports:
      - "3010:3000"
    depends_on:
      - api

volumes:
  pgdata:
